[project]
name = "git-paoding"
version = "0.1.2"
description = "Semantic review slicing for large agent-generated changes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6",
    "mypy>=1.15",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.11",
]

[dependency-groups]
dev = [
    "hypothesis>=6",
    "mypy>=1.15",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.11",
]

[project.scripts]
git-paoding = "git_paoding.cli.main:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-m", "not performance"]
testpaths = ["tests"]
markers = [
    "unit: fast tests without external processes",
    "integration: tests using local Git repositories without network access",
    "performance: explicit field-shaped architectural operation-count benchmarks",
]

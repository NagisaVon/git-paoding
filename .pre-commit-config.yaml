repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --extra dev ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        entry: uv run --extra dev ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --extra dev mypy
        language: system
        types_or: [python, pyi]
        require_serial: true

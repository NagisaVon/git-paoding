name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Build wheel and source distribution
        run: uv build

      - name: Check distribution metadata
        run: uv tool run --from twine twine check dist/*

      - name: Verify typing marker is packaged
        run: |
          python -c 'import glob, zipfile; wheel = glob.glob("dist/*.whl"); assert len(wheel) == 1; assert "git_paoding/py.typed" in zipfile.ZipFile(wheel[0]).namelist()'
          tar -tzf dist/*.tar.gz | grep -q '/src/git_paoding/py.typed$'

      - name: Verify agent plugins are packaged
        run: |
          python -c 'import glob, zipfile; names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist(); root = "git_paoding/_agent_plugins/git-paoding/"; assert root + ".codex-plugin/plugin.json" in names; assert root + ".claude-plugin/plugin.json" in names; assert root + "skills/git-paoding/SKILL.md" in names'
          tar -tzf dist/*.tar.gz | grep -q '/src/git_paoding/_agent_plugins/git-paoding/skills/git-paoding/SKILL.md$'

      - name: Install and run wheel in a fresh virtual environment
        run: |
          uv venv --python 3.13 "${RUNNER_TEMP}/wheel-venv"
          uv pip install --python "${RUNNER_TEMP}/wheel-venv/bin/python" dist/*.whl
          "${RUNNER_TEMP}/wheel-venv/bin/git-paoding" --version
          PATH="${RUNNER_TEMP}/wheel-venv/bin:${PATH}" git paoding --version
          mkdir "${RUNNER_TEMP}/wheel-agent-install"
          cd "${RUNNER_TEMP}/wheel-agent-install"
          "${RUNNER_TEMP}/wheel-venv/bin/git-paoding" agent install --target codex --target claude --scope project
          test -f .agents/skills/git-paoding/SKILL.md
          test -f .claude/skills/git-paoding/SKILL.md

      - name: Install and run source distribution in a fresh virtual environment
        run: |
          uv venv --python 3.13 "${RUNNER_TEMP}/sdist-venv"
          uv pip install --python "${RUNNER_TEMP}/sdist-venv/bin/python" dist/*.tar.gz
          "${RUNNER_TEMP}/sdist-venv/bin/git-paoding" --version
          PATH="${RUNNER_TEMP}/sdist-venv/bin:${PATH}" git paoding --version

      - name: Install and run wheel through pipx
        env:
          PIPX_HOME: ${{ runner.temp }}/pipx-home
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx-bin
        run: |
          uv venv --python 3.13 "${RUNNER_TEMP}/pipx-runner"
          uv pip install --python "${RUNNER_TEMP}/pipx-runner/bin/python" pipx
          "${RUNNER_TEMP}/pipx-runner/bin/python" -m pipx install dist/*.whl
          "${PIPX_BIN_DIR}/git-paoding" --version
          PATH="${PIPX_BIN_DIR}:${PATH}" git paoding --version

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/git-paoding
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
